name: ci
on:
  push:
    branches:
    - develop
  pull_request:
    branches:
    - develop
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clone Repo
      uses: actions/checkout@v4
    - name: Installing HTMLHINT
      run: npm install --save-dev htmlhint
    - name: Installing Stylelint
      run: npm install --save-dev stylelint
    - name: linting html
      run: npx htmlhint "**/*.html"
    - name: linting style
      run: npx stylelint "**/*.css"
